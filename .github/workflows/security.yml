name: security
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "17 3 * * 1" }]   # weekly: new advisories / new CodeQL queries against unchanged code
permissions: {}   # deny by default; every job asks for exactly what it needs
concurrency: { group: "security-${{ github.ref }}", cancel-in-progress: true }

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }   # full history: the scan reads every commit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with: { node-version: 20 }
      - run: node scripts/secret-scan.test.mjs
      - run: node scripts/secret-scan.mjs --no-zip   # tracked files + full history; dist/ is not in the repo

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with: { node-version: 20 }
      - run: npm audit --omit=dev   # the extension ships zero runtime deps, so this must stay empty
      - run: npm audit --audit-level=high   # dev tooling (pglite, playwright-core): fail only on high+

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with: { node-version: 20, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run test:unit
      - run: npm run test:sql   # every migration, twice, in PGlite

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read, security-events: write, actions: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370   # v4.39.1
        with: { languages: javascript-typescript, queries: security-extended }
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370   # v4.39.1
        with: { category: "/language:javascript-typescript" }

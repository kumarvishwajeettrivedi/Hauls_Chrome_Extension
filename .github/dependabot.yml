version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups: { dev-tooling: { patterns: ["*"] } }
  - package-ecosystem: github-actions   # keeps the full-SHA pins current
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
